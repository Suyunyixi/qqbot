services:
  bot:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    ports:
      - "${BOT_WEB_BIND:-127.0.0.1}:${BOT_WEB_PORT:-8765}:8765"
    volumes:
      - ${BOT_DATA_HOST:-./data}:/data
      - ${BOT_CONFIG_HOST:-./config}:/app/config:ro
      - ${BOT_PLUGINS_HOST:-./plugins}:/app/plugins:ro
      - ${BOT_WORKSPACE_HOST:-./workspace}:/workspace
      - ${BOT_MODEL_ENV_HOST:-./.env}:/run/config/model.env:ro
    environment:
      BOT_DATA_DIR: /data
      BOT_ATTACHMENT_MAX_MB: ${BOT_ATTACHMENT_MAX_MB:-1024}
      BOT_SQLITE_PATH: ${BOT_SQLITE_PATH:-/data/bot.sqlite}
      BOT_CHECKPOINT_PATH: ${BOT_CHECKPOINT_PATH:-/data/checkpoints.sqlite}
      BOT_WORKSPACE_DIR: /workspace
      BOT_HOST: 0.0.0.0
      BOT_CONTROL_INTERFACE: eth1
      BOT_MODEL_ENV_PATH: /run/config/model.env
      QQ_INTENTS: ${QQ_INTENTS:-}
      PYTHON_RUNNER_URL: http://python-runner:8766
      BOT_CONFIG_PATH: /app/config/config.yaml
      BOT_PERSONA_PATH: /app/config/persona.md
      TOOL_PLUGIN_DIR: /app/plugins
      SEARCH_BASE_URL: http://searxng:8080
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Asia/Shanghai
    networks:
      default:
        interface_name: eth0
      runner-control:
        interface_name: eth1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  python-runner:
    build:
      context: ./runner
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    environment:
      BOT_WEB_PORT: ${BOT_WEB_PORT:-8765}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    networks:
      - runner-control
      - runner-egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ${SEARXNG_CONFIG_HOST:-./docker/searxng-settings.yml}:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  runner-control:
    internal: true
  runner-egress:
